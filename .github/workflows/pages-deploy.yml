name: 'Automatic build'
on:
  push:
    branches:
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

jobs:
  continuous-delivery:

    runs-on: ubuntu-latest

    env:
      GEMS_PATH: /tmp/bundle

    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.6.10

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bundle Caching
        id: bundle-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.GEMS_PATH }}
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Bundle config
        run: |
          bundle config path ${{ env.GEMS_PATH }}

      - name: Bundle Install
        if: steps.bundle-cache.outputs.cache-hit != 'true'
        run: |
          bundle install

      - name: Bundle Install locally
        if: steps.bundle-cache.outputs.cache-hit == 'true'
        run: |
          bundle install --local

      - name: Check baseurl
        run: |
          baseurl="$(grep '^baseurl:' _config.yml | sed "s/.*: *//;s/['\"]//g;s/#.*//")"
          if [[ -n $baseurl ]]; then
            echo "SPEC_TEST=_site_no_baseurl" >> $GITHUB_ENV
          fi

      - name: Check layouts exist
        run: |
          # Jekyll treats a missing layout as a warning, not an error, and
          # renders the page as its bare body. That is how the Agents and
          # Ants post went blank when a merge deleted _layouts/asm-viewer.html.
          # Fail fast instead.
          status=0
          while read -r file layout; do
            [[ -z $layout || $layout == none ]] && continue
            if [[ ! -f "_layouts/$layout.html" ]]; then
              echo "::error file=$file::layout '$layout' is referenced but _layouts/$layout.html does not exist"
              status=1
            fi
          done < <(grep -rHm1 '^layout:' _posts tabs _layouts ./*.md ./*.html 2>/dev/null \
                   | awk -F'layout:' '{ f=$1; sub(/:$/, "", f); l=$2; gsub(/[ "\047\r]/, "", l); print f, l }')
          exit $status

      - name: Build Site
        run: |
          set -o pipefail
          JEKYLL_ENV=production bundle exec jekyll b 2>&1 | tee build.log

          # Missing layouts/includes and similar problems only surface as
          # "Build Warning" lines; treat them as failures.
          if grep -q 'Build Warning' build.log; then
            echo "::error::Jekyll reported build warnings (see log above); refusing to deploy"
            exit 1
          fi

          if [[ -n $SPEC_TEST ]]; then
            # Bypass the defects of htmlproofer
            JEKYLL_ENV=production bundle exec jekyll b -b "" -d "$SPEC_TEST"
          fi

      - name: Deploy
        run: |
          bash tools/deploy.sh
